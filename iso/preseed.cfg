# Disk partitioning and administrator credentials remain interactive.
# Schedule the full interactive setup only on the installed system.
d-i preseed/late_command string in-target mkdir -p /var/lib/paimenos; in-target touch /var/lib/paimenos/setup-pending; in-target systemctl enable paimenos-setup.service NetworkManager.service; in-target systemctl set-default multi-user.target
