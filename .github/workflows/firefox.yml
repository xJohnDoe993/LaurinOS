name: Firefox Webapps
on:
  push:
    branches: ['fix/firefox-*']
  pull_request:
    paths:
      - 'src/paimenos/browser.py'
      - 'src/paimenos/webapp.py'
      - 'src/paimenos/close_overlay.py'
      - 'src/paimenos/menu.py'
      - 'tests/test_browser.py'
      - 'tests/test_firefox_integration.py'
      - '.github/workflows/firefox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    container: debian:${{ matrix.debian }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Firefox and X11 test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-xlib python3-pyqt5 firefox-esr xvfb xauth openbox
          useradd -m -s /bin/sh webtest
      - name: Profile and lifecycle tests
        run: python3 -B -m unittest discover -s tests -p test_browser.py -v
      - name: Real Firefox cache and restart tests
        env:
          PAIMENOS_FIREFOX_INTEGRATION: '1'
          MOZ_DISABLE_CONTENT_SANDBOX: '1'
        run: |
          runuser -u webtest -- env HOME=/home/webtest xvfb-run -a sh -c 'openbox > /tmp/openbox.log 2>&1 & python3 -B -m unittest discover -s tests -p test_firefox_integration.py -v'
