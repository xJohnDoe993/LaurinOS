<div class="actions">{% for minutes in [5,15,30] %}<form method="post" action="{{ url_for('bonus') }}"><input type="hidden" name="minutes" value="{{ minutes }}"><input type="hidden" name="return_to" value="{{ return_to }}"><button class="ok">+{{ minutes }} {{ t('Min.') }}</button></form>{% endfor %}</div>{% if info.limit==0 %}<p class="hint">{{ t('Bonuszeit wirkt, sobald ein Tageslimit gesetzt ist.') }}</p>{% endif %}
