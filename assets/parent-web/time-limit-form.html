<section class="panel"><h2>Tageslimit</h2><form method="post"><div class="formgrid"><div><label for="limit">Minuten pro Tag</label><input id="limit" type="number" name="daily_limit_minutes" min="0" max="600" step="1" value="{{ info.limit }}" required><p class="hint">0 bedeutet unbegrenzt. Maximal 600 Minuten.</p></div><div><label for="preset">Schnellauswahl</label><select id="preset" onchange="if(this.value!=='')document.getElementById('limit').value=this.value"><option value="">Limit auswählen …</option><option value="30">30 Minuten</option><option value="60">60 Minuten</option><option value="90">90 Minuten</option><option value="120">120 Minuten</option><option value="0">Unbegrenzt</option></select></div></div><button>Tageslimit speichern</button></form></section><section class="panel"><h2>Bonuszeit</h2><p>Heute zusätzlich: {{ info.bonus }} Minuten</p>
