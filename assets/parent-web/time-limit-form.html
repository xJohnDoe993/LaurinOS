<section class="panel"><h2>{{ t('Tageslimit') }}</h2><form method="post"><div class="formgrid"><div><label for="limit">{{ t('Minuten pro Tag') }}</label><input id="limit" type="number" name="daily_limit_minutes" min="0" max="600" step="1" value="{{ info.limit }}" required><p class="hint">{{ t('0 bedeutet unbegrenzt. Maximal 600 Minuten.') }}</p></div><div><label for="preset">{{ t('Schnellauswahl') }}</label><select id="preset" onchange="if(this.value!=='')document.getElementById('limit').value=this.value"><option value="">{{ t('Limit auswählen …') }}</option><option value="30">{{ t('30 Minuten') }}</option><option value="60">{{ t('60 Minuten') }}</option><option value="90">{{ t('90 Minuten') }}</option><option value="120">{{ t('120 Minuten') }}</option><option value="0">{{ t('Unbegrenzt') }}</option></select></div></div><button>{{ t('Tageslimit speichern') }}</button></form></section><section class="panel"><h2>{{ t('Bonuszeit') }}</h2><p>{{ t('Heute zusätzlich:') }} {{ info.bonus }} {{ t('Minuten') }}</p>
