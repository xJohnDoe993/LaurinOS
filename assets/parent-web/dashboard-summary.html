<div class="grid"><section class="panel"><div class="row"><h2>Bildschirmzeit heute</h2><span class="badge {{ 'off' if info.remaining==0 else 'on' }}">{{ 'Limit erreicht' if info.remaining==0 else 'Ohne Limit' if info.limit==0 else 'Zeit verfügbar' }}</span></div><p class="muted">Tageslimit: {{ info.limit ~ ' Min.' if info.limit else 'Unbegrenzt' }} · Bonus: {{ info.bonus }} Min.</p>{% if info.limit %}<div class="bar" role="progressbar" aria-label="Genutzte Bildschirmzeit" aria-valuenow="{{ info.percent }}" aria-valuemin="0" aria-valuemax="100"><i style="width:{{ info.percent }}%"></i></div>{% endif %}<p>Heute etwas mehr Zeit schenken</p>
