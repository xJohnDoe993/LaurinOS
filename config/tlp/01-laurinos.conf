# LaurinOS: Basisregeln. /etc/tlp.conf hat Vorrang.
TLP_ENABLE=1
# Kamera, USB-Medien und USB-Audio sollen zuverlässig verfügbar bleiben.
USB_AUTOSUSPEND=0
# Bei manchen WLAN-Adaptern verursacht Power Saving Verbindungsabbrüche.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
# Funkgeräte nicht automatisch umschalten: Bluetooth-Kopfhörer/WLAN behalten.
# TLP-RDW ist installiert; eigene Regeln können in /etc/tlp.conf gesetzt werden.
DEVICES_TO_DISABLE_ON_LAN_CONNECT=""
DEVICES_TO_DISABLE_ON_WIFI_CONNECT=""
DEVICES_TO_DISABLE_ON_WWAN_CONNECT=""
DEVICES_TO_ENABLE_ON_LAN_DISCONNECT=""
DEVICES_TO_ENABLE_ON_WIFI_DISCONNECT=""
DEVICES_TO_ENABLE_ON_WWAN_DISCONNECT=""
DEVICES_TO_ENABLE_ON_DOCK=""
DEVICES_TO_DISABLE_ON_DOCK=""
DEVICES_TO_ENABLE_ON_UNDOCK=""
DEVICES_TO_DISABLE_ON_UNDOCK=""
